// Stonecutter project setup for multi-version, multi-loader VR Throwing Extensions
// The root branch hosts the common source, loader branches live in fabric/, forge/ and neoforge/

pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Architectury'
            url = 'https://maven.architectury.dev/'
        }
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'NeoForge'
            url = 'https://maven.neoforged.net/releases/'
        }
        maven {
            name = 'Stonecutter'
            url = 'https://maven.kikugie.dev/releases'
        }
        maven {
            name = 'StonecutterSnapshots'
            url = 'https://maven.kikugie.dev/snapshots'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.kikugie.stonecutter" version "0.10"
    id "org.gradle.toolchains.foojay-resolver-convention" version "1.0.0"
}

stonecutter {
    // This project uses Groovy build scripts
    kotlinController = false
    centralScript = "build.gradle"

    create(rootProject) {
        // Root branch (common source) supports every version
        versions("1.20.1", "1.21.1", "1.21.11", "26.2", "26.3")

        // Loader branches only get nodes for versions they can build
        branch("fabric")
        branch("forge") {
            versions("1.20.1")
        }
        branch("neoforge") {
            versions("1.21.1", "1.21.11", "26.2", "26.3")
        }

        // Version the shared source should be reset to before committing
        vcsVersion = "1.21.11"
    }
}

rootProject.name = "vr_throwing_extensions"
