// Shared build script for the forge branch (invoked once per versioned node)
// Forge only builds for 1.20.1

apply from: rootProject.file("replacements.gradle")

// Per-version values live in versions/<version>/gradle.properties, fall back to them
def commonNodeProps = new Properties()
def commonNodeFile = rootProject.file("versions/${project.name}/gradle.properties")
if (commonNodeFile.exists()) commonNodeFile.withInputStream { commonNodeProps.load(it) }
def nodeProp = { String key ->
    (project.findProperty(key) ?: commonNodeProps.getProperty(key) ?: "").toString()
}
def javaVersion = Integer.parseInt(nodeProp("java_version"))
def commonProject = rootProject.findProject(":${project.name}")

apply plugin: "dev.architectury.loom"
apply plugin: "architectury-plugin"
apply plugin: "com.gradleup.shadow"

// Create the sourcesJar task early so it can be configured below
java {
    withSourcesJar()
}

version = "${project.name}-${rootProject.mod_version}"
group = rootProject.maven_group + ".forge"
base {
    archivesName = rootProject.archives_base_name + "-forge"
}


architectury {
    platformSetupLoomIde()
    forge()
}

// Access widener processed per node with replacements applied (the era rule sets the namespace header)
def awSource = rootProject.file("src/main/resources/vr-throwing-extensions.accesswidener")
def processedAw = stonecutter.process(awSource, "build/processed/vr-throwing-extensions.accesswidener")
// Mixin config ships from common resources, dev runs resolve it from this mod root only
def mixinsSource = rootProject.file("src/main/resources/vr-throwing-extensions.mixins.json")
def processedMixins = stonecutter.process(mixinsSource, "build/processed/vr-throwing-extensions.mixins.json")

// Stonecutter writes these files during configuration only, back them with tasks so consumers
// get a real ordering edge and deleted outputs regenerate before anything reads them
def processAw = tasks.register("processAccessWidener") {
    inputs.file(awSource)
    outputs.file(processedAw)
    doLast { stonecutter.process(awSource, "build/processed/vr-throwing-extensions.accesswidener") }
}
def processMixins = tasks.register("processMixinConfig") {
    inputs.file(mixinsSource)
    outputs.file(processedMixins)
    doLast { stonecutter.process(mixinsSource, "build/processed/vr-throwing-extensions.mixins.json") }
}

tasks.matching { it.name in ["remapJar", "remapSourcesJar", "validateAccessWidener"] }.configureEach {
    dependsOn processAw
}
tasks.matching { it.name == "processResources" }.configureEach {
    dependsOn processMixins
}

loom {
    silentMojangMappingsLicense()
    accessWidenerPath = processedAw

    forge {
        mixinConfig "vr-throwing-extensions.mixins.json"
    }
}

configurations {
    common
    shadowCommon

    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

repositories {
    mavenLocal()
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = "CurseMaven"
        url = "https://cursemaven.com"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.name}"
    mappings loom.layered() {
        officialMojangMappings()
    }

    forge "net.minecraftforge:forge:${nodeProp('forge_version')}"

    modImplementation "net.fabricmc:fabric-loader:${nodeProp('fabric_loader_version')}"
    modApi "maven.modrinth:vivecraft:${nodeProp('vivecraft_mc')}-${nodeProp('vivecraft_version')}-forge"

    common(project(path: commonProject.path, configuration: "namedElements")) { transitive = false }
    shadowCommon(project(path: commonProject.path, configuration: "transformProductionForge")) { transitive = false }

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${rootProject.mixin_extras_version}"))
    implementation(include("io.github.llamalad7:mixinextras-forge:${rootProject.mixin_extras_version}"))
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.name
    inputs.property "forge_version", nodeProp("forge_version")

    filesMatching("META-INF/mods.toml") {
        expand "version": project.version,
                "minecraft_version": project.name,
                "forge_version": nodeProp("forge_version")
    }

    filesMatching("pack.mcmeta") {
        expand "version": project.version
    }

    from(processMixins)
}

jar {
    archiveClassifier = "dev"
}

shadowJar {
    exclude "architectury.common.json"
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input = shadowJar.archiveFile
    atAccessWideners.add loom.accessWidenerPath.get().asFile.name
    dependsOn shadowJar
    archiveClassifier = null
}

sourcesJar {
    def commonSources = commonProject.tasks.named("sourcesJar")
    dependsOn commonSources
    from(commonSources.flatMap { it.archiveFile }.map { zipTree(it) })
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

java {
    def toolchainVersion = nodeProp("toolchain_version") ?: nodeProp("java_version")
    toolchain {
        languageVersion = JavaLanguageVersion.of(Integer.parseInt(toolchainVersion))
    }
    sourceCompatibility = JavaVersion.toVersion(javaVersion)
    targetCompatibility = JavaVersion.toVersion(javaVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = javaVersion
}

def buildAndCollect = tasks.register("buildAndCollect", Copy) {
    group = "build version"
    description = "Must run through 'build-<version>' or 'buildAll'"
    from(remapJar.archiveFile)
    into(rootProject.layout.buildDirectory.dir("dist"))
    dependsOn("build")
}

// Hide generated sources and run folders from IDEA search, this only fires during a sync
// (Stonecutter drives IDE imports through its ideaSyncTask, no Gradle build requests that)
if (System.getProperty("idea.syncActive") == "true" || gradle.startParameter.taskNames.isEmpty() ||
        gradle.startParameter.taskNames.any { it.contains("ideaSyncTask") }) {
    apply plugin: "idea"
    idea.module.excludeDirs += file("run")
    afterEvaluate {
        def keepAuthored = { dirs ->
            dirs.findAll { !it.absolutePath.replace("\\", "/").contains("build/generated/stonecutter") }
        }
        sourceSets.all {
            java.setSrcDirs(keepAuthored(java.srcDirs))
            resources.setSrcDirs(keepAuthored(resources.srcDirs))
        }
    }
}
