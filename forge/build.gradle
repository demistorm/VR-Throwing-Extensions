// Forge module build configuration for VR Throwing Extensions
// This module contains Forge-specific implementations and runtime dependencies
// All common VR logic is in the common module - this just handles Forge integration

plugins {
    // Shadow plugin for bundling common module
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

// Configure Architectury for this Forge module
architectury {
    platformSetupLoomIde()
    forge()
}

// Set loader-specific archive name for better organization
archivesBaseName = rootProject.archives_base_name + "-forge"

loom {
    // Access widener for StandingAndWallBlockItem.getPlacementState (torch wall placement)
    def aw = project(":common").file("src/main/resources/vr-throwing-extensions.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }

    forge {
        mixinConfig "vr-throwing-extensions.mixins.json"
    }
}

configurations {
    // Common module configuration
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this

    // Build configuration inheritance
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

repositories {
    // Add repositories to publish here
    maven { url "https://cursemaven.com" }
}

dependencies {
    // Core Forge dependency
    forge "net.minecraftforge:forge:${rootProject.forge_version}"

    // EventBus 7 annotation processor for compile-time validation
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0-beta.7'

    // Include the common module with all shared VR logic
    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive false }

    // Vivecraft runtime dependency (Forge version)
    modApi "maven.modrinth:vivecraft:${rootProject.minecraft_version}-${rootProject.vivecraft_version}-forge"

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${rootProject.mixin_extras_version}"))
    implementation(include("io.github.llamalad7:mixinextras-forge:${rootProject.mixin_extras_version}"))
}

// Add run configurations with EventBus 7 runtime validation
loom {
    runs {
        // applies to all the run configs below
        configureEach {
            property 'eventbus.api.strictRuntimeChecks', 'true'
        }
    }
}

// Process resources and expand version placeholders
processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", rootProject.minecraft_version
    inputs.property "forge_version", rootProject.forge_version

    filesMatching("META-INF/mods.toml") {
        expand "version": inputs.properties.version,
                "minecraft_version": inputs.properties.minecraft_version,
                "forge_version": inputs.properties.forge_version
    }

    filesMatching("pack.mcmeta") {
        expand "version": inputs.properties.version
    }
}

// Configure shadow JAR for including common module
shadowJar {
    exclude "architectury.common.json"
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

// Remap shadow JAR to proper Forge format
remapJar {
    input.set shadowJar.archiveFile
    atAccessWideners.add loom.accessWidenerPath.get().asFile.name
    dependsOn shadowJar
    archiveClassifier = null
}

// Configure regular JAR for development
jar {
    archiveClassifier = "dev"
}

// Configure sources JAR to include common module sources
sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

// Configure Java components for publishing
components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

// Publishing configuration for Forge builds
publishing {
    publications {
        mavenForge(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }
}